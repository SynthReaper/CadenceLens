<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <filter id="logoShadow" x="0" y="0" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#1e1b19" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(4, 3)">
    <!-- Badge Container with Press Shadow -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#cb4914" stroke="#1e1b19" stroke-width="2.5" filter="url(#logoShadow)" />
    <!-- Dashed Inner Stitching -->
    <rect x="3" y="3" width="38" height="38" rx="9" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2.5,2" opacity="0.65" />
    
    <!-- Sound Waveform Spectrum -->
    <rect x="9" y="19" width="3" height="8" rx="1.5" fill="#ffffff" />
    <rect x="14" y="14" width="3" height="18" rx="1.5" fill="#ffffff" />
    <rect x="19" y="8" width="3" height="30" rx="1.5" fill="#ffffff" />
    <rect x="24" y="11" width="3" height="24" rx="1.5" fill="#ffffff" />
    <rect x="29" y="16" width="3" height="14" rx="1.5" fill="#ffffff" />
    <rect x="34" y="21" width="3" height="5" rx="1.5" fill="#ffffff" />

    <!-- Corner pushpin -->
    <circle cx="37" cy="7" r="3" fill="#37613d" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Brand Typography -->
  <text x="58" y="24" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#1e1b19" letter-spacing="-0.03em">
    CadenceLens
  </text>
  <text x="59" y="39" font-family="'Space Mono', 'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#872a00" letter-spacing="0.08em">
    FORENSIC SPEECH LAB
  </text>
</svg>
